<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TecniConecta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../estilo/login.css">
</head>
<body class="bg-dark text-light">

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

            <div class="card card-tecni p-3 p-sm-4 shadow">
                <div class="card-body">

                    <div class="text-center mb-4">
                        <div class="logo-box mb-2">
                            <i class="bi bi-gear-wide-connected fs-1 text-primary"></i>
                        </div>
                        <h2 class="fw-bold mb-1">
                            <span class="text-white">Tecni</span><span class="text-primary">Conecta</span>
                        </h2>
                        <p class="text-secondary small">Plataforma de Servicios Técnicos - Iniciar Sesión</p>
                    </div>

                    <div id="alertContainer"></div>

                    <form id="formLogin" novalidate>

                        <div class="mb-3">
                            <label for="email" class="form-label form-label-tecni">Correo Electrónico <span class="text-danger">*</span></label>
                            <input type="email" class="form-control form-control-tecni" id="email" name="email" placeholder="correo@ejemplo.com" autocomplete="username" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label form-label-tecni">Contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-tecni border-end-0" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                                <button class="btn btn-eye border-start-0" type="button" id="togglePassword">
                                    <i class="bi bi-eye-slash" id="iconPassword"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="btnSubmit" class="btn btn-tecni w-100 py-2 fw-semibold">
                            <span id="btnText">Ingresar</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top border-secondary border-opacity-25">
                        <small class="text-secondary">¿Eres cliente y aún no tienes cuenta?
                            <a href="../modulos/Clientes/register-client.html" class="text-primary text-decoration-none fw-semibold">Regístrate</a>
                        </small>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../controlador/login.js"></script>
</body>
</html>

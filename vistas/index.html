<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecniConecta - Servicios Técnicos Profesionales</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0b1120;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hub-card {
            background-color: #111c33;
            border: 1px solid #1e2e4f;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .btn-portal {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-portal:hover {
            background-color: #1d4ed8;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.4);
        }
        .btn-portal-outline {
            background-color: #0b1120;
            color: #cbd5e1;
            border: 1px solid #24355a;
            padding: 0.85rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-portal-outline:hover {
            background-color: #17233f;
            color: #ffffff;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="hub-card text-center">
                    <div class="mb-3">
                        <i class="bi bi-gear-wide-connected fs-1 text-primary"></i>
                    </div>
                    <h2 class="fw-bold mb-1">
                        <span class="text-white">Tecni</span><span class="text-primary">Conecta</span>
                    </h2>
                    <p class="text-secondary small mb-4">Plataforma de Servicios Técnicos - Portal de Acceso</p>

                    <div class="d-flex flex-column gap-3 text-start mb-4">
                        <a href="../modulos/Clientes/profile-client.html" class="btn-portal">
                            <div class="d-flex align-items-center gap-3">
                                <i class="bi bi-person-gear fs-4 text-white"></i>
                                <div>
                                    <div class="fw-bold">Gestión de Perfil</div>
                                    <small class="text-white-50" style="font-size: 0.78rem;">Ver y actualizar datos personales, foto y contraseña</small>
                                </div>
                            </div>
                            <i class="bi bi-chevron-right fs-5"></i>
                        </a>

                        <a href="../modulos/Clientes/register-client.html" class="btn-portal-outline">
                            <div class="d-flex align-items-center gap-3">
                                <i class="bi bi-person-plus-fill fs-4 text-primary"></i>
                                <div>
                                    <div class="fw-bold text-white">Registro de Cliente</div>
                                    <small class="text-secondary" style="font-size: 0.78rem;">Crear una nueva cuenta en la plataforma</small>
                                </div>
                            </div>
                            <i class="bi bi-chevron-right fs-5"></i>
                        </a>
                    </div>

                    <div class="border-top border-secondary border-opacity-25 pt-3">
                        <small class="text-secondary">TecniConecta &copy; 2026 - Módulos del Sistema</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
